# Azure Container Apps Deployment Configuration
# Quebec Voice Agent with KEDA Auto-Scaling

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quebec-voice-agent
  namespace: production
  labels:
    app: quebec-voice-agent
    version: v1.0.0
spec:
  replicas: 2  # Minimum replicas
  selector:
    matchLabels:
      app: quebec-voice-agent
  template:
    metadata:
      labels:
        app: quebec-voice-agent
        version: v1.0.0
    spec:
      containers:
      - name: quebec-voice-agent
        image: ${AZURE_CONTAINER_REGISTRY}/quebec-voice-agent:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        # Environment variables from secrets
        env:
        - name: AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: voice-agent-secrets
              key: azure-openai-endpoint

        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: voice-agent-secrets
              key: azure-openai-api-key

        - name: AZURE_OPENAI_DEPLOYMENT_NAME
          value: "gpt-4o-realtime"

        - name: AZURE_OPENAI_API_VERSION
          value: "2024-10-01-preview"

        - name: AZURE_AI_SEARCH_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: voice-agent-secrets
              key: azure-search-endpoint

        - name: AZURE_AI_SEARCH_KEY
          valueFrom:
            secretKeyRef:
              name: voice-agent-secrets
              key: azure-search-key

        - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: voice-agent-secrets
              key: azure-di-endpoint

        - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
          valueFrom:
            secretKeyRef:
              name: voice-agent-secrets
              key: azure-di-key

        - name: DATABASE_URL
          value: "sqlite+aiosqlite:///./data/inventory/vehicles.db"

        - name: DEFAULT_LANGUAGE
          value: "fr-CA"

        - name: QUEBEC_COMPLIANCE_MODE
          value: "true"

        - name: VAD_THRESHOLD_DBFS
          value: "-45"

        - name: MAX_CONNECTIONS
          value: "100"

        # Resource limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Managed Identity
        volumeMounts:
        - name: azure-identity
          mountPath: /var/run/secrets/azure
          readOnly: true

      # Use managed identity
      serviceAccountName: quebec-voice-agent-identity

      volumes:
      - name: azure-identity
        projected:
          sources:
          - serviceAccountToken:
              audience: api://AzureADTokenExchange
              expirationSeconds: 3600
              path: token

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: quebec-voice-agent-service
  namespace: production
spec:
  type: LoadBalancer
  selector:
    app: quebec-voice-agent
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8000
    protocol: TCP

---
# KEDA ScaledObject for Auto-Scaling
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: quebec-voice-agent-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: quebec-voice-agent

  # Scaling configuration
  minReplicaCount: 2
  maxReplicaCount: 20

  # Cooldown periods
  cooldownPeriod: 300  # 5 minutes
  pollingInterval: 30   # Check every 30 seconds

  # Triggers
  triggers:

  # Scale based on active WebSocket connections
  - type: external
    metadata:
      scalerAddress: custom-metrics-scaler:8080
      metricName: active_connections
      targetValue: "50"  # Scale when > 50 active connections per pod

  # Scale based on CPU utilization
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"  # Scale when CPU > 70%

  # Scale based on memory utilization
  - type: memory
    metricType: Utilization
    metadata:
      value: "80"  # Scale when memory > 80%

  # Scale based on HTTP request rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: http_requests_per_second
      threshold: "100"
      query: |
        sum(rate(http_requests_total{app="quebec-voice-agent"}[1m]))

---
# Horizontal Pod Autoscaler (Fallback)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quebec-voice-agent-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quebec-voice-agent

  minReplicas: 2
  maxReplicas: 20

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: quebec-voice-agent-config
  namespace: production
data:
  app.yaml: |
    app:
      name: quebec-voice-agent
      version: 1.0.0
      environment: production

    features:
      bill_96_compliance: true
      default_language: fr-CA
      vad_enabled: true
      vad_threshold: -45

    limits:
      max_connections: 100
      max_session_duration: 3600
      max_audio_buffer_size: 10485760  # 10MB

    logging:
      level: INFO
      format: json
      output: stdout

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quebec-voice-agent-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: quebec-voice-agent

  policyTypes:
  - Ingress
  - Egress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000

  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

  # Allow Azure services
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
# Service Account with Managed Identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quebec-voice-agent-identity
  namespace: production
  annotations:
    azure.workload.identity/client-id: ${AZURE_WORKLOAD_IDENTITY_CLIENT_ID}
    azure.workload.identity/tenant-id: ${AZURE_TENANT_ID}
